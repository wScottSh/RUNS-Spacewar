# The outline compiler (source lines 398-507): ocs, the JSP routine that
# lays out half a swap twice, then oc, the JDA routine that compiles one
# outline into the code space.
replaces = "lift/outline_compiler.c"
pool = ["outline_compiler.codes_left", "outline_compiler.codes_rest", "pen.saved_x", "pen.saved_y"]

# The flag that says what the next 6 code compiles. Flag 6 also holds
# spaceship.rocket and the central star's mirror bit: each of the three
# sets or clears it before it reads it (clf 6 here, at the star's start,
# and in steer).
[flags]
"outline_compiler.six" = 6

[spell.six_code]
store = 0
restore = 1

# The outline word the compiler reads is kept in the address field of the
# instruction that reads it (ocg, lio .).
[homes]
"outline_compiler.table" = "pointer"

# Fields that hold a place in a Record collection hold its address.
[into]
"outline_call.code" = "outline_code.insn"
"outline_call.table" = "outlines.codes"
"outline_compiler.table" = "outlines.codes"

[[place]]
routine = "compile_swap"
convention = "JSP"
io_param = "handoff.swap"

# The code goes through oc's entry word. The routine steps past the word
# after its call (idx ocx) once mark_start has taken the code's address
# from AC; the two jumps it fills in lie after its return (ocm, ocn).
[[place]]
routine = "compile_outline"
convention = "JDA"
entry = "outline_call.code"
inline = "outline_call.table"
result = ["outline_call.code"]
io = ["handoff.codes"]
args_done = "mark_start"
data = ["outline_compiler.start_over", "outline_compiler.to_other_side"]
