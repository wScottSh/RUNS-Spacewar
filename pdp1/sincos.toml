# cos and sin: jda subroutines. cos stores its shifted angle in sin's entry
# word and jumps into sin's body. The series keeps x in sin's entry word,
# x^2 and then the answer in cos's. The reduction loop is laid out with its
# first exit falling into the series and the rest after the last return.
replaces = "lift/sincos.c"

[[place]]
routine = "cosine"
convention = "JDA"
entry = "cosine_call.angle"
cells = ["sine_call.x_squared", "sine_call.answer"]
result = ["sine_call.result"]

[[place]]
routine = "sine"
convention = "JDA"
entry = "sine_call.angle"
cells = ["sine_call.x"]
block = "sine_series"
block_takes_entry = true
io = ["sign"]
loops = "exit first"
result = ["sine_call.result"]
